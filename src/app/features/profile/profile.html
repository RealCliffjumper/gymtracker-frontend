<div class="profile-container">
  <nz-card class="profile-card">
    <div nz-row [nzGutter]="24">
      <div nz-col [nzSpan]="12">
        <form nz-form [formGroup]="userForm" (ngSubmit)="onSave()" >
          <!-- <div class="profile-avatar">
            <nz-avatar nzSize="large" nzIcon="user"></nz-avatar>
          </div> -->

          <nz-form-item>
            <nz-form-label [nzSpan]="5" class="form-label">First Name</nz-form-label>
            <nz-form-control [nzSpan]="19">
              <input nz-input placeholder='First Name' formControlName="userFirstName" name="firstName" />
            </nz-form-control>
          </nz-form-item> 

          <nz-form-item>
            <nz-form-label [nzSpan]="5" class="form-label">Last Name</nz-form-label>
            <nz-form-control [nzSpan]="19">
              <input nz-input placeholder="Last name" formControlName="userLastName" name="lastName" />
            </nz-form-control>
          </nz-form-item>

          <nz-form-item>
            <nz-form-label [nzSpan]="5" class="form-label-email">Email</nz-form-label>
            <nz-form-control [nzSpan]="19">
              <input nz-input placeholder="Email" formControlName="userLoginId" name="userLoginId" type="email" />
            </nz-form-control>
          </nz-form-item>

          <button nz-button nzType="default" type="button" (click)="openChangePasswordModal()" class="openPasswordModal">
            Change Password
          </button>

          <div class="unit-selector">
            <label class="unit-label">Preferred units of weight:</label>
            <nz-radio-group formControlName="unitPreference" name="unitPreference">
              <label nz-radio-button nzValue="KG" class="KG">KG</label>
              <label nz-radio-button nzValue="LBS" class="LBS">LBS</label>
            </nz-radio-group>
          </div>

          <button nz-button nzType="primary" class="save-btn" type="saveProfile">Save</button>
        </form>
        
      </div>


      <div nz-col [nzSpan]="12" class="exercises-panel">
        <h3 class="ex-title">My exercises</h3>
        <nz-card nzBordered="true" class="exercise-card">
          @if(exercises().length > 0){
          <nz-list>
            @for (exercise of exercises(); track exercise.exerciseId){
            <nz-list-item (click)="goToExercise(exercise)" class="exercise-name">{{ exercise.exerciseName }}</nz-list-item>
            }
          </nz-list>
          } @else {
            <p style="color:var(--ant-text-highlight);">No exercises added yet.</p>
          }
        </nz-card>
        <nz-icon class="addExerciseBtn" nzType="plus" nzTheme="outline" nz-tooltip nzTooltipTitle="Add exercise" (click)="openCreateExerciseModal()"/>
      </div>
      
    </div>
    
  </nz-card>
<nz-icon nzType="delete" nzTheme="outline" (click)="deleteUser()"></nz-icon>
</div>

<nz-modal
  [(nzVisible)]="isPasswordModalVisible"
  nzTitle="Change Password"
  (nzOnCancel)="handleCancel()"
  (nzOnOk)="handleOk()"
  [nzOkLoading]="isSubmitting"
>
<ng-container *nzModalContent>
  <form [formGroup]="passwordForm" (ngSubmit)="handleOk()">
    <nz-form-item>
      <nz-form-label [nzSpan]="6">Old Password</nz-form-label>
      <nz-form-control [nzSpan]="18">
        <input nz-input type="password" formControlName="oldPassword" class="oldPassword"/>
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label [nzSpan]="6">New Password</nz-form-label>
      <nz-form-control [nzSpan]="18">
        <input nz-input type="password" formControlName="newPassword" class="newPassword">
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label [nzSpan]="6">Confirm</nz-form-label>
      <nz-form-control [nzSpan]="18">
        <input nz-input type="password" formControlName="confirmPassword" class="confirmPassword"/>
      </nz-form-control>
    </nz-form-item>

  </form>
</ng-container>

<div *nzModalFooter>
      <button nz-button nzType="default" type="button" (click)="handleCancel()">Cancel</button>
      <button 
      nz-button nzType="primary" 
      type="submit" 
      (click)="handleOk()" 
      class="savePassword"
      [disabled]="passwordForm.invalid || isSubmitting"
      [ngClass]="{ 'btn-enabled': passwordForm.valid && !isSubmitting }">
        Change Password
      </button>
</div>

</nz-modal>
